[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "moescope"
version = "0.1.0"
description = "MoE routing telemetry: log every router decision on the GPU, drain once"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["mixture-of-experts", "moe", "routing", "cuda", "telemetry", "interpretability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/Knightkolla/moescope"

[project.optional-dependencies]
torch = ["torch>=2.0"]
examples = ["torch>=2.0", "transformers>=4.40"]
test = ["pytest>=7"]

[tool.maturin]
# Rust extension lives at moescope._native; the Python API is in python/moescope.
module-name = "moescope._native"
python-source = "python"
# -F on the CLI replaces this list, so for the GPU backend pass all of them:
#   maturin develop --release -F python,pyo3/extension-module,cuda-13000
features = ["python", "pyo3/extension-module"]
